name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - phase-5-money-priority-engine
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      CI_EVIDENCE_DIR: ci-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CI evidence
        if: always()
        shell: pwsh
        env:
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_PR_ACTION: ${{ github.event.action }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_EVENT_BEFORE: ${{ github.event.before }}
          CI_EVENT_AFTER: ${{ github.event.after }}
        run: |
          New-Item -ItemType Directory -Force -Path ci-evidence | Out-Null
          @(
            "event=$env:GITHUB_EVENT_NAME"
            "action=$env:CI_PR_ACTION"
            "repository=$env:GITHUB_REPOSITORY"
            "pr=$env:CI_PR_NUMBER"
            "base_sha=$env:CI_BASE_SHA"
            "head_sha=$env:CI_HEAD_SHA"
            "event_before=$env:CI_EVENT_BEFORE"
            "event_after=$env:CI_EVENT_AFTER"
            "tested_sha=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "run_number=$env:GITHUB_RUN_NUMBER"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "job=verify"
            "runner=windows-latest"
          ) | Set-Content -Path ci-evidence\run-context.txt -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test CI change classifier
        id: classifier_tests
        continue-on-error: true
        run: |
          node --test scripts\ci-change-mode.test.mjs > ci-evidence\classifier-tests.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\classifier-tests.log
          exit /b %code%

      - name: Classify change mode
        id: classify
        if: always()
        continue-on-error: true
        env:
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_PR_ACTION: ${{ github.event.action }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_EVENT_BEFORE: ${{ github.event.before }}
          CI_EVENT_AFTER: ${{ github.event.after }}
        run: node scripts\ci-change-mode.mjs

      - name: Verify predecessor CI continuity
        id: predecessor
        if: ${{ steps.classifier_tests.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.mode == 'DOCS_ONLY' && steps.classify.outputs.requires_predecessor == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_PREDECESSOR_SHA: ${{ steps.classify.outputs.predecessor_sha }}
        run: node scripts\ci-change-mode.mjs --verify-predecessor

      - name: Install dependencies
        id: install
        if: ${{ steps.classifier_tests.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.mode != 'DOCS_ONLY' }}
        run: |
          npm ci > ci-evidence\install-dependencies.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\install-dependencies.log
          exit /b %code%

      - name: Validate AI control-plane state
        id: ai_state
        if: always()
        run: |
          npm run ai:validate-state > ci-evidence\ai-state.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\ai-state.log
          exit /b %code%

      - name: Audit production dependencies
        id: dependency_audit
        if: ${{ steps.classifier_tests.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.mode != 'DOCS_ONLY' }}
        run: |
          npm audit --omit=dev --audit-level=high > ci-evidence\dependency-audit.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\dependency-audit.log
          exit /b %code%

      - name: Test calculations
        id: calculations
        if: ${{ steps.classifier_tests.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.mode != 'DOCS_ONLY' }}
        run: |
          npm test > ci-evidence\calculations.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\calculations.log
          exit /b %code%

      - name: Test security policy contract
        id: security
        if: ${{ steps.classifier_tests.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.mode != 'DOCS_ONLY' }}
        run: |
          npm run test:security > ci-evidence\security.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\security.log
          exit /b %code%

      - name: Type check
        id: typecheck
        if: ${{ steps.classifier_tests.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.mode != 'DOCS_ONLY' }}
        run: |
          npm run typecheck > ci-evidence\typecheck.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\typecheck.log
          exit /b %code%

      - name: Lint
        id: lint
        if: ${{ steps.classifier_tests.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.mode != 'DOCS_ONLY' }}
        run: |
          npm run lint > ci-evidence\lint.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\lint.log
          exit /b %code%

      - name: Build
        id: build
        if: ${{ steps.classifier_tests.outcome == 'success' && steps.classify.outcome == 'success' && steps.classify.outputs.mode != 'DOCS_ONLY' }}
        run: |
          npm run build > ci-evidence\build.log 2>&1
          set "code=%ERRORLEVEL%"
          type ci-evidence\build.log
          exit /b %code%

      - name: Record validation outcomes
        if: always()
        shell: pwsh
        env:
          CI_MODE: ${{ steps.classify.outputs.mode }}
          CI_REASON: ${{ steps.classify.outputs.reason }}
          CI_SCOPE: ${{ steps.classify.outputs.scope }}
          CI_REQUIRES_PREDECESSOR: ${{ steps.classify.outputs.requires_predecessor }}
          CI_PREDECESSOR_SHA: ${{ steps.classify.outputs.predecessor_sha }}
          CI_PREDECESSOR_RUN_ID: ${{ steps.predecessor.outputs.run_id }}
          CLASSIFIER_TESTS: ${{ steps.classifier_tests.outcome }}
          CLASSIFY: ${{ steps.classify.outcome }}
          PREDECESSOR: ${{ steps.predecessor.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          AI_STATE: ${{ steps.ai_state.outcome }}
          DEPENDENCY_AUDIT: ${{ steps.dependency_audit.outcome }}
          CALCULATIONS: ${{ steps.calculations.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          $mode = if ([string]::IsNullOrWhiteSpace($env:CI_MODE)) { "FAILED_CLOSED" } else { $env:CI_MODE }
          $reason = if ([string]::IsNullOrWhiteSpace($env:CI_REASON)) { "classification-unavailable-job-failed-closed" } else { $env:CI_REASON }

          $rows = @(
            [pscustomobject]@{ Stage = "Classifier tests"; Outcome = $env:CLASSIFIER_TESTS }
            [pscustomobject]@{ Stage = "Change classification"; Outcome = $env:CLASSIFY }
            [pscustomobject]@{ Stage = "Predecessor continuity"; Outcome = $env:PREDECESSOR }
            [pscustomobject]@{ Stage = "Install dependencies"; Outcome = $env:INSTALL }
            [pscustomobject]@{ Stage = "AI state validation"; Outcome = $env:AI_STATE }
            [pscustomobject]@{ Stage = "Dependency audit"; Outcome = $env:DEPENDENCY_AUDIT }
            [pscustomobject]@{ Stage = "Calculation tests"; Outcome = $env:CALCULATIONS }
            [pscustomobject]@{ Stage = "Security tests"; Outcome = $env:SECURITY }
            [pscustomobject]@{ Stage = "Typecheck"; Outcome = $env:TYPECHECK }
            [pscustomobject]@{ Stage = "Lint"; Outcome = $env:LINT }
            [pscustomobject]@{ Stage = "Build"; Outcome = $env:BUILD }
          )

          @(
            "mode=$mode"
            "reason=$reason"
            "scope=$env:CI_SCOPE"
            "requires_predecessor=$env:CI_REQUIRES_PREDECESSOR"
            "predecessor_sha=$env:CI_PREDECESSOR_SHA"
            "predecessor_run_id=$env:CI_PREDECESSOR_RUN_ID"
            ""
            "stage`toutcome"
          ) | Set-Content -Path ci-evidence\stage-outcomes.tsv -Encoding utf8

          foreach ($row in $rows) {
            "$($row.Stage)`t$($row.Outcome)" | Add-Content -Path ci-evidence\stage-outcomes.tsv -Encoding utf8
          }

          @(
            ""
            "## Foundation CI validation outcomes"
            ""
            "- Effective mode: **$mode**"
            "- Reason: ``$reason``"
            "- Scope: ``$env:CI_SCOPE``"
            "- Requires predecessor: ``$env:CI_REQUIRES_PREDECESSOR``"
            "- Predecessor SHA: ``$env:CI_PREDECESSOR_SHA``"
            "- Predecessor run: ``$env:CI_PREDECESSOR_RUN_ID``"
            "- Runner: ``windows-latest``"
            ""
            "| Stage | Outcome |"
            "|---|---|"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

          foreach ($row in $rows) {
            "| $($row.Stage) | $($row.Outcome) |" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Upload Foundation CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce CI guardrails
        if: always()
        shell: pwsh
        env:
          CI_MODE: ${{ steps.classify.outputs.mode }}
          CI_REQUIRES_PREDECESSOR: ${{ steps.classify.outputs.requires_predecessor }}
          CLASSIFIER_TESTS: ${{ steps.classifier_tests.outcome }}
          CLASSIFY: ${{ steps.classify.outcome }}
          PREDECESSOR: ${{ steps.predecessor.outcome }}
          AI_STATE: ${{ steps.ai_state.outcome }}
        run: |
          $failures = @()
          if ($env:CLASSIFIER_TESTS -ne "success") { $failures += "classifier-tests=$env:CLASSIFIER_TESTS" }
          if ($env:CLASSIFY -ne "success") { $failures += "classification=$env:CLASSIFY" }
          if ($env:AI_STATE -ne "success") { $failures += "ai-state=$env:AI_STATE" }
          if ($env:CI_MODE -eq "DOCS_ONLY" -and $env:CI_REQUIRES_PREDECESSOR -eq "true" -and $env:PREDECESSOR -ne "success") {
            $failures += "predecessor-continuity=$env:PREDECESSOR"
          }

          if ($failures.Count -gt 0) {
            Write-Error ("Foundation CI guardrail failure: " + ($failures -join ", "))
            exit 1
          }

          Write-Host "Foundation CI guardrails passed."
