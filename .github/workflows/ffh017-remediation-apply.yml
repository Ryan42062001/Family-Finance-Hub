name: FFH-017 Remediation Apply

on:
  push:
    branches:
      - ffh/ffh-017-audit-remediation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64, ffh-local]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffh/ffh-017-audit-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair apply harness quoting
        run: node .github\ffh017-remediation-fix.cjs
      - name: Apply bounded remediation
        run: node .github\ffh017-remediation-apply.cjs
      - name: Install dependencies
        run: npm ci
      - name: Focused remediation validation
        run: node --experimental-strip-types --test lib/calculations/ffh-017-audit-remediation.test.ts lib/calculations/ffh-017-goal-retirement-competition.test.ts lib/calculations/ffh-013-spousal-ira-ledger.test.ts
      - name: Type check
        run: npm run typecheck
      - name: Commit bounded remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ffh-017): remediate audit findings R01 R02 R03"
          git push origin HEAD:ffh/ffh-017-audit-remediation
