name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - phase-5-money-priority-engine
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, ffh-local]
    defaults:
      run:
        shell: cmd
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate AI control-plane state
        run: npm run ai:validate-state
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Diagnose calculation test output
        run: |
          call npm test > ffh017-ci-diagnostic.txt 2>&1
          echo TEST_EXIT=%ERRORLEVEL%
          findstr /N /C:"not ok" /C:"AssertionError" /C:"ERR_" /C:"error:" /C:"Error:" /C:"failed" /C:"cancelled" ffh017-ci-diagnostic.txt
          exit /b 0
