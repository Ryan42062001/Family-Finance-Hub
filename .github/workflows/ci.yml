name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - phase-5-money-priority-engine
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate AI control-plane state
        run: npm run ai:validate-state
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Diagnose FFH-017 pure allocator
        run: node --experimental-strip-types --test lib/calculations/money-priority-build-competition.test.ts
      - name: Diagnose FFH-017 Build integration
        run: node --experimental-strip-types --test lib/calculations/ffh-017-goal-retirement-competition.test.ts
      - name: Diagnose legacy Build calculations
        run: node --experimental-strip-types --test lib/calculations/money-priority-build.test.ts
      - name: Diagnose residual retirement catch-up
        run: node --experimental-strip-types --test --test-name-pattern="retirement catch-up" lib/calculations/money-priority-residual-needs.test.ts
      - name: Diagnose residual goal funding
        run: node --experimental-strip-types --test --test-name-pattern="goal funding" lib/calculations/money-priority-residual-needs.test.ts
      - name: Diagnose residual reserve deployment
        run: node --experimental-strip-types --test --test-name-pattern="reserve deployment" lib/calculations/money-priority-residual-needs.test.ts
      - name: Diagnose residual employer match
        run: node --experimental-strip-types --test --test-name-pattern="employer match" lib/calculations/money-priority-residual-needs.test.ts
      - name: Diagnose residual debt payoff
        run: node --experimental-strip-types --test --test-name-pattern="debt payoff" lib/calculations/money-priority-residual-needs.test.ts
      - name: Diagnose residual capacity invariant
        run: node --experimental-strip-types --test --test-name-pattern="cross-stage monthly-capacity invariant" lib/calculations/money-priority-residual-needs.test.ts
      - name: Diagnose FFH-017 residual-needs regression
        run: node --experimental-strip-types --test lib/calculations/money-priority-residual-needs.test.ts
      - name: Diagnose engine deterministic
        run: node --experimental-strip-types --test --test-name-pattern="deterministic" lib/calculations/money-priority-engine.test.ts
      - name: Diagnose engine secure-before-build
        run: node --experimental-strip-types --test --test-name-pattern="secure recommendations" lib/calculations/money-priority-engine.test.ts
      - name: Diagnose engine Build capacity
        run: node --experimental-strip-types --test --test-name-pattern="does not allocate more Build" lib/calculations/money-priority-engine.test.ts
      - name: Diagnose engine stabilize
        run: node --experimental-strip-types --test --test-name-pattern="negative cash flow" lib/calculations/money-priority-engine.test.ts
      - name: Diagnose engine missing gross
        run: node --experimental-strip-types --test --test-name-pattern="missing gross income" lib/calculations/money-priority-engine.test.ts
      - name: Diagnose engine rank stability
        run: node --experimental-strip-types --test --test-name-pattern="rank values" lib/calculations/money-priority-engine.test.ts
      - name: Diagnose audit calculations
        run: node --experimental-strip-types --test lib/calculations/money-priority-audit.test.ts
      - name: Diagnose optimize-engine calculations
        run: node --experimental-strip-types --test lib/calculations/money-priority-optimize-engine.test.ts
      - name: Probe calculations group 1
        if: always()
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          lib/calculations/dashboard-insights.test.ts
          lib/calculations/debt-payoff.test.ts
          lib/calculations/emergency-fund.test.ts
          lib/calculations/ffh-006-retirement-statutory-remediation.test.ts
          lib/calculations/ffh-012-hsa-legal-capacity.test.ts
          lib/calculations/ffh-013-final-audit-remediation-2.test.ts
          lib/calculations/ffh-013-final-audit-remediation.test.ts
          lib/calculations/ffh-013-m02-equal-compensation-excess.test.ts
          lib/calculations/ffh-013-spousal-ira-ledger.test.ts
          lib/calculations/ffh-015-simple-core-remediation.test.ts
          lib/calculations/ffh-025-hsa-compound-authority-materiality.test.ts
          lib/calculations/ffh-028-hsa-candidate-pair-cardinality.test.ts
          lib/calculations/financial-summary.test.ts
          lib/calculations/home-affordability.test.ts
      - name: Probe calculations group 2
        if: always()
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          lib/calculations/money-priority-advanced-retirement.test.ts
          lib/calculations/money-priority-committed-expenses.test.ts
          lib/calculations/money-priority-contribution-period.test.ts
          lib/calculations/money-priority-core.test.ts
          lib/calculations/money-priority-exceptional-reserve.test.ts
          lib/calculations/money-priority-existing-cash-full.test.ts
          lib/calculations/money-priority-existing-cash.test.ts
      - name: Probe calculations group 3
        if: always()
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          lib/calculations/money-priority-final-audit-remediation.test.ts
          lib/calculations/money-priority-final-high-remediation.test.ts
          lib/calculations/money-priority-fresh-final-remediation.test.ts
          lib/calculations/money-priority-goal-intelligence.test.ts
          lib/calculations/money-priority-goal-ranking.test.ts
          lib/calculations/money-priority-hardening.test.ts
      - name: Probe calculations group 4
        if: always()
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          lib/calculations/money-priority-hsa-contract-hypothetical.test.ts
          lib/calculations/money-priority-hsa-household-uncertainty.test.ts
          lib/calculations/money-priority-hsa-input-contract.test.ts
          lib/calculations/money-priority-hybrid-retirement-floor.test.ts
          lib/calculations/money-priority-hypothetical.test.ts
          lib/calculations/money-priority-married-hsa-remediation.test.ts
      - name: Probe calculations group 5
        if: always()
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          lib/calculations/money-priority-optimize.test.ts
          lib/calculations/money-priority-recommendation-refresh-adversarial.test.ts
          lib/calculations/money-priority-recommendation-refresh.test.ts
      - name: Probe calculations group 6
        if: always()
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          lib/calculations/money-priority-retirement-accounts.test.ts
          lib/calculations/money-priority-retirement-integration.test.ts
          lib/calculations/money-priority-retirement-projection.test.ts
          lib/calculations/money-priority-secure.test.ts
          lib/calculations/money-priority-simple-plan-contract.test.ts
          lib/calculations/money-priority-snapshot.test.ts
      - name: Probe calculations group 7
        if: always()
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          lib/calculations/money-priority-student-loans.test.ts
          lib/calculations/money-priority-user-plan.test.ts
          lib/calculations/money-priority-windfall.test.ts
      - name: Probe calculations group 8
        if: always()
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          lib/calculations/mortgage-extra-payment.test.ts
          lib/calculations/paycheck-planner.test.ts
          lib/calculations/phase-5-closure-cash-matching.test.ts
          lib/calculations/phase-5-closure-hsa-capacity.test.ts
          lib/calculations/phase-5-closure-spousal-ira.test.ts
          lib/calculations/phase-5-closure-workplace-limits.test.ts
          lib/calculations/retirement-contribution-pacing.test.ts
          lib/calculations/savings-goal.test.ts
          lib/calculations/vehicle-affordability.test.ts
      - name: Test calculations
        run: npm test
      - name: Test security policy contract
        run: npm run test:security
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
