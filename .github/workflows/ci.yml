name: Speed Workflow V2.1 CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Full phase validation
        required: true
        type: choice
        options: [full]
      head_sha:
        description: Exact candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  fast:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Checkout SHA mismatch' }
      - run: node scripts/validate-release-candidate.mjs
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run typecheck
      - run: npm run lint

  full-phase:
    if: (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'full-phase-ci') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
    steps:
      - name: Validate requested SHA
        shell: pwsh
        run: if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Exact head SHA required' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact checkout
        shell: pwsh
        run: if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Checkout SHA mismatch' }
      - run: node scripts/validate-release-candidate.mjs
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Deterministic calculation/security repeat
        run: |
          npm test
          npm run test:security
