name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - phase-5-money-priority-engine
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, ffh-local]
    defaults:
      run:
        shell: cmd
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate AI control-plane state
        run: npm run ai:validate-state
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Capture calculation test output
        run: |
          call npm test > ffh017-ci-diagnostic.txt 2>&1
          echo %ERRORLEVEL%> ffh017-ci-diagnostic.exit
          exit /b 0
      - name: Persist calculation diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffh017-ci-diagnostic.txt ffh017-ci-diagnostic.exit
          git commit -m "ci(ffh-017): capture calculation failure [skip ci]"
          git push origin HEAD:ffh/ffh-017-audit-remediation
