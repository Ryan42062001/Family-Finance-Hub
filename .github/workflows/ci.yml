name: Foundation CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Focused FFH-025 regressions
        run: node --experimental-strip-types --test lib/calculations/ffh-025-hsa-compound-authority-materiality.test.ts
      - name: Focused FFH-012 HSA regressions
        run: node --experimental-strip-types --test lib/calculations/ffh-012-hsa-legal-capacity.test.ts lib/calculations/money-priority-hsa-*.test.ts lib/calculations/phase-5-closure-hsa-capacity.test.ts
      - name: Focused retirement Build integration regressions
        run: node --experimental-strip-types --test lib/calculations/money-priority-retirement-accounts.test.ts lib/calculations/money-priority-retirement-integration.test.ts lib/calculations/money-priority-build.test.ts
      - name: Test calculations
        run: npm test
      - name: Test security policy contract
        continue-on-error: true
        run: npm run test:security
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
