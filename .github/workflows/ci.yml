name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - phase-5-money-priority-engine
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, ffh-local]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Read prior FFH-017 diagnostic context
        run: powershell -NoProfile -Command "$lines = Get-Content 'ffh017-ci-diagnostic.txt'; $lines[2678..2720]; Write-Output '---SECOND FAILURE---'; $lines[3222..3265]"
      - uses: actions/checkout@v4
