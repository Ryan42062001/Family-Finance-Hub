name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - phase-5-money-priority-engine
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, ffh-local]
    defaults:
      run:
        shell: cmd
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate AI control-plane state
        run: npm run ai:validate-state
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Diagnose calculation concurrency ladder
        shell: pwsh
        continue-on-error: true
        run: |
          $levels = @(2, 4, 8, 0)
          foreach ($level in $levels) {
            $label = if ($level -eq 0) { "default" } else { "$level" }
            $log = "aggregate-$label.log"
            Write-Host "=== CONCURRENCY=$label ==="
            if ($level -eq 0) {
              & node --experimental-strip-types --test lib/calculations/*.test.ts *> $log
            } else {
              & node --experimental-strip-types --test --test-concurrency=$level lib/calculations/*.test.ts *> $log
            }
            $code = $LASTEXITCODE
            Write-Host "CONCURRENCY_$($label)_EXIT=$code"
            if ($code -ne 0) {
              Get-Content $log | Select-String -Pattern 'not ok|failureType|error:|code:|ERR_|AssertionError|testCodeFailure|cancelledByParent|SIG|spawn|timeout|expected|actual' -Context 4,12
            }
          }
          exit 0
      - name: Test calculations
        run: npm test
      - name: Test security policy contract
        run: npm run test:security
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
