name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - phase-5-money-priority-engine
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate AI control-plane state
        run: npm run ai:validate-state
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Diagnose FFH-017 pure allocator
        run: node --experimental-strip-types --test lib/calculations/money-priority-build-competition.test.ts
      - name: Diagnose FFH-017 Build integration
        run: node --experimental-strip-types --test lib/calculations/ffh-017-goal-retirement-competition.test.ts
      - name: Diagnose required-goal Build regression
        run: node --experimental-strip-types --test --test-name-pattern="required fixed goal" lib/calculations/money-priority-build.test.ts
      - name: Diagnose optional-goal Build regression
        run: node --experimental-strip-types --test --test-name-pattern="optional goals" lib/calculations/money-priority-build.test.ts
      - name: Diagnose missing-gross Build regression
        run: node --experimental-strip-types --test --test-name-pattern="missing gross income" lib/calculations/money-priority-build.test.ts
      - name: Diagnose legacy Build calculations
        run: node --experimental-strip-types --test lib/calculations/money-priority-build.test.ts
      - name: Diagnose engine-facing calculations
        run: node --experimental-strip-types --test lib/calculations/money-priority-engine.test.ts lib/calculations/money-priority-audit.test.ts lib/calculations/money-priority-optimize-engine.test.ts
      - name: Test calculations
        run: npm test
      - name: Test security policy contract
        run: npm run test:security
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
