name: FFH-P01 Windows cleanup mocks

on:
  push:
    branches:
      - feature/ffh-p01-automatic-test-cleanup
    paths:
      - 'scripts/rls-local/**'
      - 'tests/security/fixtures/ffh-p01-integrated-22.ps1'
      - 'tests/security/fixtures/ffh-p01-gate-exit.ps1'
      - 'tests/security/ffh-p01-integrated-22.test.ts'
      - '.github/workflows/ffh-p01-windows-mocks.yml'

permissions:
  contents: read

jobs:
  offline-mocks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 22 isolated real WinPS5.1 fake-Docker cases
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -File tests\security\fixtures\ffh-p01-integrated-22.ps1
      - name: Gate B PASS/PASS exit zero
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -File tests\security\fixtures\ffh-p01-gate-exit.ps1 -Case PASS_PASS
      - name: Gate B PASS/BLOCKED and FAIL/PASS return nonzero
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -File tests\security\fixtures\ffh-p01-gate-exit.ps1 -Case PASS_BLOCKED
          if not errorlevel 1 exit /b 1
          powershell.exe -NoProfile -NonInteractive -File tests\security\fixtures\ffh-p01-gate-exit.ps1 -Case FAIL_PASS
          if not errorlevel 1 exit /b 1
          exit /b 0
