name: FFH-P01 Local PostgreSQL RLS (isolated)

on:
  push:
    branches: [phase/ffh-p01-release-readiness]

permissions:
  contents: read

concurrency:
  group: ffh-p01-local-rls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-local-rls:
    if: github.repository == 'Ryan42062001/Family-Finance-Hub'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Confirm exact branch checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Isolated local Supabase migration and RLS contract
        shell: bash
        run: bash scripts/rls-local/run.sh
