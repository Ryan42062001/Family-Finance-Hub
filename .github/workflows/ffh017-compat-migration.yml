name: FFH-017 Legacy Compatibility Migration

on:
  push:
    branches:
      - ffh/ffh-017-goal-retirement-competition

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffh/ffh-017-goal-retirement-competition
      - name: Apply bounded test compatibility migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          helper = Path('lib/calculations/legacy-goal-test-fixtures.ts')
          helper.write_text('''import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";\n\n/**\n * Test-only adapter for pre-Phase-5C fixtures whose legacy ranking fields were\n * intended as confirmed facts. Production normalization must remain fail-closed.\n */\nexport function withConfirmedLegacyGoalFacts(raw: MoneyPriorityRawSnapshot): MoneyPriorityRawSnapshot {\n  const copy = structuredClone(raw);\n  copy.goals = (copy.goals ?? []).map((goal) => ({\n    ...goal,\n    goal_intelligence_confirmed: goal.goal_intelligence_confirmed === undefined ? true : goal.goal_intelligence_confirmed,\n    core_need_amount: goal.core_need_amount === undefined ? goal.target_amount : goal.core_need_amount,\n    planned_monthly_contribution: goal.planned_monthly_contribution === undefined ? 0 : goal.planned_monthly_contribution,\n    underlying_need: goal.underlying_need === undefined ? `${goal.name ?? goal.id} household need` : goal.underlying_need,\n    desired_solution: goal.desired_solution === undefined ? `${goal.name ?? goal.id} solution` : goal.desired_solution,\n    goal_nature: goal.goal_nature === undefined\n      ? (goal.necessity === "optional" ? "improvement" : "preservation")\n      : goal.goal_nature,\n    underfunding_consequence: goal.underfunding_consequence === undefined\n      ? ((goal.consequence_level === "high" || goal.consequence_level === "critical") ? "other_material" : "inconvenience")\n      : goal.underfunding_consequence,\n    borrowing_likelihood: goal.borrowing_likelihood === undefined ? "unlikely" : goal.borrowing_likelihood,\n    expected_borrowing_amount: goal.expected_borrowing_amount === undefined ? null : goal.expected_borrowing_amount,\n    expected_borrowing_apr: goal.expected_borrowing_apr === undefined ? null : goal.expected_borrowing_apr,\n  }));\n  return copy;\n}\n''')

          wrappers = {
            'lib/calculations/home-affordability.test.ts': (
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";',
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";\nimport { withConfirmedLegacyGoalFacts } from "./legacy-goal-test-fixtures.ts";',
              'function engine(raw = baseRaw()) { return runMoneyPriorityEngine(raw, AS_OF); }',
              'function engine(raw = baseRaw()) { return runMoneyPriorityEngine(withConfirmedLegacyGoalFacts(raw), AS_OF); }',
            ),
            'lib/calculations/vehicle-affordability.test.ts': (
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";',
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";\nimport { withConfirmedLegacyGoalFacts } from "./legacy-goal-test-fixtures.ts";',
              'function engine(raw = baseRaw()) {\n  return runMoneyPriorityEngine(raw, AS_OF);\n}',
              'function engine(raw = baseRaw()) {\n  return runMoneyPriorityEngine(withConfirmedLegacyGoalFacts(raw), AS_OF);\n}',
            ),
            'lib/calculations/money-priority-user-plan.test.ts': (
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";',
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";\nimport { withConfirmedLegacyGoalFacts } from "./legacy-goal-test-fixtures.ts";',
              'function engine(raw = baseRaw()) {\n  return runMoneyPriorityEngine(raw, AS_OF);\n}',
              'function engine(raw = baseRaw()) {\n  return runMoneyPriorityEngine(withConfirmedLegacyGoalFacts(raw), AS_OF);\n}',
            ),
            'lib/calculations/money-priority-committed-expenses.test.ts': (
              'import { runMoneyPriorityEngine } from "./money-priority-engine.ts";',
              'import { runMoneyPriorityEngine } from "./money-priority-engine.ts";\nimport { withConfirmedLegacyGoalFacts } from "./legacy-goal-test-fixtures.ts";',
              'function engine(raw = baseRaw()) {\n  return runMoneyPriorityEngine(raw, AS_OF);\n}',
              'function engine(raw = baseRaw()) {\n  return runMoneyPriorityEngine(withConfirmedLegacyGoalFacts(raw), AS_OF);\n}',
            ),
            'lib/calculations/money-priority-recommendation-refresh.test.ts': (
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";',
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";\nimport { withConfirmedLegacyGoalFacts } from "./legacy-goal-test-fixtures.ts";',
              'function engine(source = raw(), date = "2026-08-30") { return runMoneyPriorityEngine(source, date); }',
              'function engine(source = raw(), date = "2026-08-30") { return runMoneyPriorityEngine(withConfirmedLegacyGoalFacts(source), date); }',
            ),
            'lib/calculations/money-priority-recommendation-refresh-adversarial.test.ts': (
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";',
              'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";\nimport { withConfirmedLegacyGoalFacts } from "./legacy-goal-test-fixtures.ts";',
              'function engine(source = raw(), date = AS_OF): MoneyPriorityEngineResult { return runMoneyPriorityEngine(source, date); }',
              'function engine(source = raw(), date = AS_OF): MoneyPriorityEngineResult { return runMoneyPriorityEngine(withConfirmedLegacyGoalFacts(source), date); }',
            ),
          }
          for path, (old_import, new_import, old_engine, new_engine) in wrappers.items():
              replace_once(path, old_import, new_import)
              replace_once(path, old_engine, new_engine)

          # Existing-cash tests exercise cash deployment, not missing goal authority.
          path = 'lib/calculations/money-priority-existing-cash-full.test.ts'
          replace_once(path,
            'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";',
            'import type { MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";\nimport { withConfirmedLegacyGoalFacts } from "./legacy-goal-test-fixtures.ts";')
          p = Path(path); text = p.read_text(); count = text.count('runMoneyPriorityEngine(raw, ')
          if count < 2:
              raise SystemExit(f'{path}: expected multiple raw engine calls, found {count}')
          p.write_text(text.replace('runMoneyPriorityEngine(raw, ', 'runMoneyPriorityEngine(withConfirmedLegacyGoalFacts(raw), '))

          # Goal-ranking legacy helper represents confirmed ranking facts in this suite.
          path = 'lib/calculations/money-priority-goal-ranking.test.ts'
          replace_once(path,
            'import { buildMoneyPrioritySnapshot, type MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";',
            'import { buildMoneyPrioritySnapshot, type MoneyPriorityRawSnapshot } from "./money-priority-snapshot.ts";\nimport { withConfirmedLegacyGoalFacts } from "./legacy-goal-test-fixtures.ts";')
          replace_once(path,
            'function raw(goals: RawGoal[], gross: number | null = null): MoneyPriorityRawSnapshot {\n  return {',
            'function raw(goals: RawGoal[], gross: number | null = null): MoneyPriorityRawSnapshot {\n  return withConfirmedLegacyGoalFacts({')
          replace_once(path,
            '    insuranceExposures: [], preferences: null,\n  };\n}\n\nfunction rank',
            '    insuranceExposures: [], preferences: null,\n  });\n}\n\nfunction rank')

          # Final-audit scenario needs explicit modern goal authority but must not alter validation scenarios globally.
          path = 'lib/calculations/money-priority-final-audit-remediation.test.ts'
          old = 'raw.goals = [{ id: "required", name: "Required repair", target_amount: 600, current_amount: 0, target_date: "2026-10-01", priority: 1, goal_class: "necessary_protective", necessity: "required", deadline_flexibility: "fixed", consequence_level: "high" }];'
          new = 'raw.goals = [{ id: "required", name: "Required repair", target_amount: 600, current_amount: 0, target_date: "2026-10-01", priority: 1, goal_class: "necessary_protective", necessity: "required", deadline_flexibility: "fixed", consequence_level: "high", goal_intelligence_confirmed: true, core_need_amount: 600, planned_monthly_contribution: 0, underlying_need: "Required home repair", desired_solution: "Complete required repair", goal_nature: "preservation", underfunding_consequence: "other_material", borrowing_likelihood: "unlikely", expected_borrowing_amount: null, expected_borrowing_apr: null }];'
          replace_once(path, old, new)

          # FFH-017 preserves planning residual that FFH-012 previously suppressed; routing assertions remain unchanged.
          replace_once('lib/calculations/ffh-012-hsa-legal-capacity.test.ts',
            'assert.equal(result.build.unresolvedRetirementMonthlyAmount, 470.84);',
            'assert.equal(result.build.unresolvedRetirementMonthlyAmount, 770.84);')

          # Projection guidance and Phase-5C additional-retirement competition are distinct FFH-D004 quantities.
          path = 'lib/calculations/money-priority-retirement-integration.test.ts'
          replace_once(path,
            '  assert.equal(result.build.allocations.some((item) => item.category === "retirement"), false);',
            '  assert.ok((result.build.competition.additionalRetirementRequestedMonthly ?? 0) > 0);\n  assert.ok((result.build.allocations.find((item) => item.category === "retirement")?.allocatedMonthlyAmount ?? 0) > 0);')
          replace_once(path,
            '  assert.equal(\n    result.build.allocations.find((item) => item.category === "retirement")?.requestedMonthlyAmount,\n    result.build.retirement.recommendedMonthlyIncrease,\n  );',
            '  const retirementRequest = result.build.allocations.find((item) => item.category === "retirement")?.requestedMonthlyAmount ?? 0;\n  assert.equal(retirementRequest, result.build.competition.additionalRetirementRequestedMonthly);\n  assert.ok(retirementRequest >= result.build.retirement.recommendedMonthlyIncrease);')

          Path('.github/workflows/ffh017-compat-migration.yml').unlink()
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ffh-017): align legacy fixtures with Phase 5C authority"
          git push origin HEAD:ffh/ffh-017-goal-retirement-competition
